name: Replace Honey Pack preview

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace:
    if: github.event.head_commit.message == 'Replace Honey Pack preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install FFmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Replace Honey Pack audio
        shell: bash
        env:
          HONEY_PACK_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/3b8ba15e-1436-4cec-a2a9-e48f0ce970ce.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTNmZjg0ODJlOGM5MjE3NSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTc5OTgxMH0.DQe_lsjJtPA1a0y3RNA1tPTHnzgyviz1r5P3v3GXR5w"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$HONEY_PACK_URL" -o /tmp/honey-pack-transfer.mp4
          ffmpeg -y -v error -i /tmp/honey-pack-transfer.mp4 -map 0:a:0 -c:a copy -movflags +faststart assets/audio/12-honey-pack.m4a
          duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 assets/audio/12-honey-pack.m4a)
          python3 - "$duration" <<'PY'
import sys
value = float(sys.argv[1])
if not 44.9 <= value <= 45.1:
    raise SystemExit(f"Unexpected Honey Pack duration: {value}")
PY
          rm .github/workflows/replace-honey-pack.yml
      - name: Commit replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/12-honey-pack.m4a .github/workflows/replace-honey-pack.yml
          git commit -m "Publish corrected Honey Pack preview"
          git push
