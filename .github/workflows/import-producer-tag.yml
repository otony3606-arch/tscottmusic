name: Build tagged fade-out previews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-producer-tag.yml'

permissions:
  contents: write

jobs:
  build-tagged-previews:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify producer tag
        run: |
          test -s assets/audio/tags/TScott_Ratchet_01_Jumpin.mp3

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build tagged 45-second previews with fade-outs
        run: |
          mkdir -p assets/audio/tagged
          for file in assets/audio/*.mp3 assets/audio/*.m4a; do
            [ -f "$file" ] || continue
            base="$(basename "$file")"
            out="assets/audio/tagged/$base"

            if [[ "$file" == *.m4a ]]; then
              codec=( -c:a aac -b:a 192k )
            else
              codec=( -c:a libmp3lame -b:a 192k )
            fi

            ffmpeg -hide_banner -loglevel error -y               -i assets/audio/tags/TScott_Ratchet_01_Jumpin.mp3               -i "$file"               -filter_complex "[0:a]aresample=44100,aformat=sample_fmts=fltp:channel_layouts=stereo[tag];[1:a]aresample=44100,aformat=sample_fmts=fltp:channel_layouts=stereo[track];[tag][track]concat=n=2:v=0:a=1,atrim=duration=45,afade=t=out:st=42.5:d=2.5[out]"               -map "[out]" "${codec[@]}" "$out"
          done

      - name: Commit tagged previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/tagged
          git diff --cached --quiet && exit 0
          git commit -m 'Add producer tag and fade-outs to web previews'
          git push origin main
