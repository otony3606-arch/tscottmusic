name: Install corrected Sex on the Beach preview

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Install corrected Sex on the Beach preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install FFmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Replace Sex on the Beach preview
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/ce44380d44eb7cf81eaf563233b9c1f6af4d74abec5699255c6acb39ada3348c.mp4" \
            -o /tmp/sex-on-the-beach-preview.mp4

          ffmpeg -y -v error \
            -i /tmp/sex-on-the-beach-preview.mp4 \
            -map 0:a:0 -t 45 -ar 44100 -ac 2 \
            -c:a libmp3lame -b:a 128k \
            assets/audio/01-sex-on-the-beach-1.mp3

          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 assets/audio/01-sex-on-the-beach-1.mp3)"
          python3 -c "d=float('$duration'); assert 44.5 <= d <= 45.5, d"

          python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/build-45-previews.yml")
          s = p.read_text()
          old = '          three_mp3 ".preview45-segments/01-prefix.m4a" "assets/audio/01-sex-on-the-beach-1.mp3" ".preview45-segments/01-suffix.m4a" ".preview45-out/01-sex-on-the-beach-1.mp3"'
          new = '          ffmpeg -y -v error -i "assets/audio/01-sex-on-the-beach-1.mp3" -t 45 -ar 44100 -ac 2 -c:a libmp3lame -b:a 128k ".preview45-out/01-sex-on-the-beach-1.mp3"'
          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
          elif new not in s:
              raise SystemExit("Could not locate the Sex on the Beach preview rule")
          PY

          rm -f .github/workflows/install-sex-on-the-beach.yml

      - name: Commit corrected preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/01-sex-on-the-beach-1.mp3 .github/workflows/build-45-previews.yml
          git add -u .github/workflows/install-sex-on-the-beach.yml
          git commit -m "Publish corrected Sex on the Beach preview"
          git push
